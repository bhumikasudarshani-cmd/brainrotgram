name: brainrotgram
description: BrainRotGram — Instagram for learning from your own code.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # Auth — Cognito + Google, PKCE
  flutter_appauth: ^7.0.1
  flutter_secure_storage: ^9.2.4

  # HTTP
  dio: ^5.7.0

  # State & routing
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1

  # Video
  video_player: ^2.9.2

  # Images
  cached_network_image: ^3.4.1

  # Haptics & share
  share_plus: ^10.1.4

  # Utilities
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  video_player_platform_interface: ^6.9.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: BasteleurBold
      fonts:
        - asset: assets/fonts/Basteleur-Bold.ttf
          weight: 700
    - family: UncutSans
      fonts:
        - asset: assets/fonts/UncutSans-Variable.ttf
